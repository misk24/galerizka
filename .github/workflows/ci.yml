name: CI

on:
  push:
    branches:
      - main
      - refactor/secure-contact-and-architecture
  pull_request:
    branches:
      - main
      - refactor/secure-contact-and-architecture
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node -e '
            const report = require(process.env.RUNNER_TEMP + "/npm-audit.json");
            const summary = report.metadata?.vulnerabilities ?? {};
            console.log("Dependency vulnerability summary:", JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: (item.via ?? []).map(advisory =>
                  typeof advisory === "string"
                    ? advisory
                    : {
                        name: advisory.name,
                        title: advisory.title,
                        url: advisory.url,
                        range: advisory.range,
                        severity: advisory.severity
                      }
                )
              }));
            }
          '

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build
        env:
          RESEND_API_KEY: re_test_ci_placeholder
