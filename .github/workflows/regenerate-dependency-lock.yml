name: Regenerate dependency lockfile

on:
  push:
    branches:
      - chore/npm-dependency-refresh
    paths:
      - package.json
      - .github/workflows/regenerate-dependency-lock.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: regenerate-dependency-lock
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate and validate npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dependency branch
        uses: actions/checkout@v4
        with:
          ref: chore/npm-dependency-refresh
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify dependency audit is clean
        run: |
          npm audit --audit-level=moderate

      - name: Run tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run production build
        run: npm run build
        env:
          RESEND_API_KEY: re_test_ci_placeholder

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: regenerate lockfile with patched minimatch"
          git push origin HEAD:chore/npm-dependency-refresh

      - name: Dispatch standard CI for the updated commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref chore/npm-dependency-refresh
